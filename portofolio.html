<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Elga Susanto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #2d2d2d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .hero-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1100px;
            width: 100%;
            padding: 40px 20px;
            gap: 40px;
        }
        .hero-text {
            flex: 1;
            max-width: 50%;
        }
        .greeting {
            display: inline-block;
            border: 2px dashed #b5a371;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            position: relative;
        }
        .greeting::before, .greeting::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: #b5a371;
        }
        .greeting::before { top: -4px; left: -4px; }
        .greeting::after { bottom: -4px; right: -4px; }

        h1 {
            font-size: 48px;
            line-height: 1.2;
            margin-bottom: 20px;
            color: #222;
        }
        .highlight {
            color: #f5a623;
            text-decoration: underline;
            text-decoration-color: #f5a623;
            text-decoration-thickness: 3px;
        }
        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .hero-image-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .blob-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            background-color: #f5a623;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            z-index: 0;
        }
        .profile-photo {
            position: relative;
            z-index: 1;
            width: 300px;
            height: auto;
            border-radius: 20px;
        }
     
        .floating-badge {
            position: absolute;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 2;
        }
        .badge-1 {
            bottom: 20px;
            left: -20px;
            background-color: #2c4033; 
            color: white;
        }
        .badge-2 {
            top: 50px;
            right: -10px;
            background-color: #f5a623; 
            color: #2d2d2d;
        }

        @media (max-width: 768px) {
            .hero-section {
                flex-direction: column;
                text-align: center;
            }
            .hero-text {
                max-width: 100%;
            }
            .badge-1 { left: 10px; }
            .badge-2 { right: 10px; }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-text">
            <div class="greeting">Hello There!</div>
            <h1>Saya <span class="highlight">Elga Susanto,</span><br>
                Mahasiswa Based in Bandung.
            </h1>
            <p>Saya adalah mahasiswa di Institut Teknologi Nasional (Itenas) Bandung . Saya tinggal di jalan Terusan brigjen katamso no.132 . Anda bisa menghubungi saya lewat <strong>elga.susanto@itenas.ac.id</strong>.</p>
        </div>
        <div class="hero-image-container">
            <div class="blob-bg"></div>
            <img src="gambar1.png" alt="Elga Susanto" class="profile-photo">
            
            <div class="floating-badge badge-1">Itenas Bandung</div>
            <div class="floating-badge badge-2">Bandung, Jabar</div>
        </div>
    </section>

</body>
</html>
